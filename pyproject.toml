[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saga-orchestrator"
version = "0.1.0"
description = "Deterministic Saga Orchestrator: a crash-tolerant, in-process DAG workflow engine with a write-ahead journal."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-timeout>=2.3"]

[project.scripts]
saga = "saga.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/saga"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 60
filterwarnings = ["error::RuntimeWarning"]
